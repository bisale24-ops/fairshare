server {
  listen 80;
  client_max_body_size 6m;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; frame-src blob:; object-src blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

  # Docker's own DNS, asked again every few seconds: if the API container is restarted and gets another address,
  # nginx follows it. (With a fixed `proxy_pass http://backend:8000` nginx resolves the name once at startup and keeps
  # pointing at the dead address forever.)
  resolver 127.0.0.11 valid=5s ipv6=off;

  # The live stream: stays open for hours, the API sends a keep-alive every 15 s.
  location = /api/stream {
    set $api backend;
    proxy_pass http://$api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Everything else: if the API is down answer fast (502) instead of letting the browser wait a minute.
  location /api/ {
    set $api backend;
    proxy_pass http://$api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;   # never replay a POST on another attempt: the client retries with its own key
  }

  location / {
    try_files $uri /index.html;
  }
}
