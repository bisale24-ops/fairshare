services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairshare
      POSTGRES_PASSWORD: fairshare
      POSTGRES_DB: fairshare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairshare"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fairshare:fairshare@db:5432/fairshare
      BASE_URL: http://localhost:8080
      REMINDER_INTERVAL_SECONDS: "60"
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
