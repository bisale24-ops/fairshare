services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fairshare
      POSTGRES_PASSWORD: fairshare
      POSTGRES_DB: fairshare
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairshare"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fairshare:fairshare@db:5432/fairshare
      BASE_URL: http://localhost:8080
      REMINDER_INTERVAL_SECONDS: "60"
      TRUST_PROXY: "1"   # the only way in is the bundled nginx, which sets X-Forwarded-For itself
      DEV_MAILBOX: "1"   # e-mail is a stub; set to 0 once a real transport is plugged in
    volumes: [uploads:/data/uploads]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      retries: 30
    depends_on:
      db: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
